name: Public portfolio integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_portfolio.py'
      - 'media/cards/*.svg'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_portfolio.py'
      - 'media/cards/*.svg'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate portfolio content and internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public profile only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify project cards, observatories and relative links
        run: python3 scripts/check_portfolio.py
