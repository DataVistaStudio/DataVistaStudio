name: Public portfolio integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_portfolio.py'
      - 'scripts/test_workflow_safety.py'
      - 'media/cards/*.svg'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  # Run for every PR because this is a required merge check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate portfolio content and internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public profile only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject unsafe workflow changes (12 offline regression cases)
        run: python3 -m unittest discover -s scripts -p 'test_workflow_safety.py' -v
      - name: Verify project cards, observatories and relative links
        run: python3 scripts/check_portfolio.py
