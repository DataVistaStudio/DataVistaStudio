name: Public portfolio link health

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/*.md'
      - 'README.md'
      - 'README.ar.md'
      - 'media/cards/*.svg'
      - 'scripts/check_public_urls.py'
      - 'scripts/test_public_urls.py'
      - '.github/workflows/public-link-health.yml'
  pull_request:
    paths:
      - 'portfolio/*.md'
      - 'README.md'
      - 'README.ar.md'
      - 'media/cards/*.svg'
      - 'scripts/check_public_urls.py'
      - 'scripts/test_public_urls.py'
      - '.github/workflows/public-link-health.yml'
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datavista-public-portfolio-link-audit
  cancel-in-progress: false

jobs:
  read-only-links:
    name: Check 16 public project links and portfolio art
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout public profile only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check URL and redirect security without network access
        run: python3 -m unittest discover -s scripts -p 'test_public_urls.py' -v
      - name: Verify live public URLs
        run: python3 scripts/check_public_urls.py
